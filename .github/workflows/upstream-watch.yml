# Weekly: open an issue when npm has a Backlog.md release missing from requirements.json "tested".
# The wrapper refuses its added commands on untested releases, so each new one needs the "Upgrade Backlog.md" runbook.
name: Upstream watch
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Open an issue for an untested Backlog.md release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(npm view backlog.md version)
          tested=$(jq -r '.tested["backlog.md"] | join(" ")' requirements.json)
          echo "latest $latest; tested $tested"
          case " $tested " in *" $latest "*) exit 0 ;; esac
          title="Backlog.md $latest is not in the tested list"
          if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "issue already open"; exit 0
          fi
          gh issue create --title "$title" --body "npm has backlog.md $latest; requirements.json tests $tested. Follow \"Upgrade Backlog.md\" in the spec (doc-1): read upstream's release notes, add the release to the tested list, run the gate, and review the skill if the pin moves."
