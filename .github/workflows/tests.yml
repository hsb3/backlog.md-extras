# Every check: bin/gate on macOS and Linux with the declared host and runtime pins.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'  # weekly, to catch runner-image and host drift between pushes
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.10.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Install system dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y jq shellcheck
          else
            brew install jq shellcheck
          fi
      - name: Install declared CLI pins
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          pins = json.load(open('requirements.json'))['pins']
          subprocess.run(['npm', 'install', '-g', 'backlog.md@' + pins['backlog.md'],
                          '@openai/codex@' + pins['codex'],
                          '@anthropic-ai/claude-code@' + pins['claude'],
                          '@fission-ai/openspec@' + pins['openspec']], check=True)
          PY
      - name: Run all checks
        run: bin/gate
